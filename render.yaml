# Render Blueprint — New + > Blueprint > select this repo. Free plan, $0.
# One web service serves API + WebSockets (/ws/connect, /ws/dashboard) + the PWA.
services:
  - type: web
    name: bridgebot-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random secret
      # The ONLY admin account (case-insensitive). Register/log in with this email to get the Master Admin dashboard.
      - key: ADMIN_EMAIL
        value: Abaudii12@gmail.com
      # Optional: if set, the admin account is auto-created at startup with this password.
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://bridgebot-ai.onrender.com
      - key: SUPPORT_WHATSAPP
        value: "966567009846"
      - key: PAYPAL_ME_URL
        value: https://paypal.me/BunnyOnMoney
      - key: PAYMENT_PROVIDER
        value: manual
      # Strongly recommended: Supabase free Postgres (Session pooler URL, port 5432).
      # Without it the SQLite fallback is used, which is WIPED on every redeploy/restart
      # because Render free instances have an ephemeral filesystem.
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY      # optional — free models; empty => template compiler
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: CORS_ORIGINS            # add your Vercel URL if you host the frontend there
        value: "*"
